<?xml version="1.0" encoding="UTF-8"?>
<!--
  The land of the Kattegat map. Only for looks: what the ship can sail on is
  decided by the text grid in src/game/map.js.

  Coordinates: 10 units per map cell, so the 29 x 14 cells are 290 x 140.
  Cell (col, row) covers x (col-1)*10 to col*10 and y (row-1)*10 to row*10.
  Example: København, cell (25, 12), is x 240-250, y 110-120.

  width/height is the size it's drawn at in the game (29 x 19 by 14 x 22
  pixels). preserveAspectRatio="none" lets it stretch to that shape.

  Water is left transparent; the game draws the water and grid underneath.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="551" height="308"
     viewBox="0 0 290 140" preserveAspectRatio="none">
  <g fill="#c87828">

    <!-- Jutland: Djursland (Grenå), Mols (Ebeltoft), Helgenæs, Aarhus Bugt -->
    <polygon points="
      0,0 92,0 93,4 88,9 78,12 72,17 71,24 73,30 70,35 68,40
      60,42 50,41 44,41 41,46 38,50 33,49 31,44 33,40 32,36 25,32 21,34
      20,45 21,55 18,65 20,75 19,85 21,95 20,105 17,112 10,115 8,120 0,122" />

    <!-- Samsø -->
    <polygon points="
      54,71 59,70 62,76 66,81 69,88 68,96 70,103 67,110
      62,108 60,100 55,96 52,88 51,80" />

    <!-- Sejerø -->
    <polygon points="101,84 106,81 110,85 108,89 103,88" />

    <!-- Zealand: Helsingør, København, Kalundborg, Odsherred, Isefjord, Hundested -->
    <polygon points="
      195,62 205,60 220,61 235,60 247,62 250,66
      249,75 246,85 244,95 242,105 245,112 250,118 249,128 246,135 248,140
      112,140 108,133 101,128 100,124 103,118 100,112 102,111
      115,112 125,110 132,106 134,102 145,100 152,97 155,92 160,86 163,81 168,80 170,84
      169,95 168,108 171,113 176,112
      180,105 179,95 181,86 178,82 173,79 172,73 178,70 185,69 190,64" />

    <!-- Sweden: Halland, Kullen (Mölle), the Øresund coast -->
    <polygon points="
      252,0 290,0 290,122 283,118 281,110 282,100 281,90 279,82 275,75 272,68
      271,62 266,55 263,45 262,35 258,31 248,31 238,32 231,27 230,24
      236,21 248,22 258,20 262,15 258,10 254,5" />

    <!-- Hven -->
    <polygon points="262,82 268,83 269,88 264,89 261,86" />

    <!-- Saltholm -->
    <polygon points="272,121 278,122 279,128 273,129" />

  </g>
</svg>
